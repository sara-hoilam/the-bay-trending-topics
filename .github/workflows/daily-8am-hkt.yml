# Daily refresh at 08:00 Hong Kong Time (00:00 UTC).
# Requires repo secrets: CURSOR_API_KEY
name: Daily GBA Pulse (08:00 HKT)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-gba-pulse
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Preflight (API key + GitHub repo access)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: node scripts/diagnose-cloud.mjs

      - name: Cloud agents (Trend Watch + Trending News)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Use the Actions token (do not use secrets.GITHUB_TOKEN — a blank repo secret overrides it)
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-daily-cloud.mjs --skip-preflight

      - name: Sync latest main after cloud agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

      - name: Install dependencies (after sync)
        run: npm install

      - name: Verify Trend Watch freshness
        run: node scripts/verify-daily-capture.mjs

      - name: Fallback merge into index.html
        run: node scripts/merge-briefing-panels.mjs

      - name: Commit fallback merge if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add index.html orchestration/fragments/overall.html orchestration/fragments/trendwatch.html
          if git diff --staged --quiet; then
            echo "No fallback changes"
          else
            git commit -m "chore(daily): merge fallback $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
            git push origin HEAD:main
          fi
