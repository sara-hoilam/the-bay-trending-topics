name: IG Leaderboard Sheet Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ig-leaderboard-sheet-sync.yml"
      - "scripts/sync-ig-leaderboard-sheet.mjs"
      - "scripts/capture-ig-leaderboard.mjs"
      - "scripts/fetch-ig-benchmark.mjs"
      - "references/ig-leaderboard-accounts.json"
      - "ig-leaderboard-data.json"

run-name: "IG sheet sync · run ${{ github.run_number }}"

permissions:
  contents: read

concurrency:
  group: ig-leaderboard-sheet-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Sheet only — do not re-fetch Instagram from GitHub Actions IPs.
      # Cloud Run 4 already captured live counts; Actions runners get HTTP 401
      # ("Please wait a few minutes") and the old ig:refresh path timed out.
      - name: Sync Google Sheet from committed leaderboard JSON
        env:
          GOOGLE_SHEETS_IG_LEADERBOARD_ID: ${{ secrets.GOOGLE_SHEETS_IG_LEADERBOARD_ID }}
          GOOGLE_SHEETS_IG_TAB: ${{ secrets.GOOGLE_SHEETS_IG_TAB }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: npm run ig:sheet-sync
