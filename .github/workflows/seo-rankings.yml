name: SEO rankings

on:
  schedule:
    # 02:30 UTC = 10:30 HKT daily. Competitors refresh on Mondays (HKT) or when older than 6 days.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      competitors:
        description: "Competitor check (uses Cursor credits)"
        type: choice
        options: [auto, always, never]
        default: auto

permissions:
  contents: write

concurrency:
  group: seo-rankings
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # @cursor/sdk needs Node >= 22.13

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture Search Console + competitor rankings
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS || secrets.GOOGLE_SHEETS_CREDENTIALS }}
          # URL-prefix property https://thebay.mo/ (references/seo-keywords.json "site").
          # Set the GSC_SITE_URL variable only for a Domain property (sc-domain:thebay.mo).
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_MODEL: ${{ vars.CURSOR_CLOUD_MODEL }}
          SEO_COMPETITORS: ${{ inputs.competitors || 'auto' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/capture-seo-rankings.mjs

      - name: Verify
        run: node scripts/verify-seo-rankings.mjs

      - name: Commit and push
        run: |
          git config user.name "gba-pulse-bot"
          git config user.email "gba-pulse-bot@users.noreply.github.com"
          git add seo-rankings-data.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "seo: rankings refresh $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i) — retrying in 15s"; sleep 15
          done
          exit 1
