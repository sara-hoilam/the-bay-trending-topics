# Daily refresh scheduled 06:00 Hong Kong Time (23:00 UTC).
# GitHub Actions queue delay is typically ~2–3 h, so runs start ~08:30 HKT and finish ~08:45.
# Tabs updated: Trend Watch, Daily Brief, Happenings, IG Leaderboard, New Hotels, Source Links (data JSON).
# Requires repo secret: CURSOR_API_KEY
# Cloud agents use Cursor Models pool (default grok-4.6) — not Other Models (Claude/GPT).
name: Daily GBA Pulse

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      cloud_model:
        description: "Cursor Models pool id (blank = grok-4.6, then grok-4.5, then composer-2.5)"
        required: false
        default: ""
        type: string

run-name: "GBA Pulse refresh · run ${{ github.run_number }}"

permissions:
  contents: write

concurrency:
  group: daily-gba-pulse
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Preflight (API key + GitHub repo access)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_MODEL: ${{ inputs.cloud_model }}
        run: node scripts/diagnose-cloud.mjs

      - name: Cloud agents (Trend Watch + Daily Brief + Happenings + IG Leaderboard)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_MODEL: ${{ inputs.cloud_model }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-daily-cloud.mjs --skip-preflight

      - name: Sync latest main after cloud agents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git checkout -f main
          git reset --hard origin/main

      - name: Install dependencies (after sync)
        run: npm install

      - name: Post-pipeline (regenerate data, verify, merge)
        env:
          GOOGLE_SHEETS_IG_LEADERBOARD_ID: ${{ secrets.GOOGLE_SHEETS_IG_LEADERBOARD_ID }}
          GOOGLE_SHEETS_IG_TAB: ${{ secrets.GOOGLE_SHEETS_IG_TAB }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: node scripts/run-daily-post.mjs

      - name: Commit post-pipeline artifacts if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add index.html \
            orchestration/fragments/overall.html \
            orchestration/fragments/trendwatch.html \
            happenings-events.json \
            source-links-data.json \
            new-hotels-data.json \
            ig-leaderboard-data.json \
            references/editor-selection-weights.json \
            "Training Data/"
          if git diff --staged --quiet; then
            echo "No post-pipeline changes"
          else
            git commit -m "chore(daily): post-pipeline $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
            git push origin HEAD:main
          fi
